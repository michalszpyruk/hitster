<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<title>Hitster PL</title>
<style>
  :root { --bg:#0b0d10; --fg:#f2f4f7; --dim:#8b93a1; --accent:#1db954; --err:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  h1 { font-size:15px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
       font-weight:600; text-align:center; margin:14px 0; }
  .screen { flex:1; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .screen.on { display:flex; }
  button { font:600 18px/1 -apple-system,system-ui,sans-serif; color:var(--fg); background:#1b1f26;
           border:1px solid #2c323c; border-radius:14px; padding:18px 24px; min-height:60px; width:100%;
           max-width:420px; cursor:pointer; }
  button.primary { background:var(--accent); color:#07130c; border-color:transparent; }
  button:active { transform:scale(.985); }
  #video { width:100%; max-width:420px; aspect-ratio:1; object-fit:cover; border-radius:20px; background:#000; }
  .hint { color:var(--dim); font-size:14px; text-align:center; max-width:420px; }
  .err { color:var(--err); font-size:14px; text-align:center; max-width:420px; min-height:1.4em; }
  .status { font-size:26px; font-weight:700; text-align:center; }
  .answer { text-align:center; }
  .answer .yr { font-size:76px; font-weight:800; line-height:1; margin:6px 0; }
  .answer .ar { font-size:17px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .answer .ti { font-size:17px; font-style:italic; color:var(--dim); }
  .row { display:flex; gap:10px; width:100%; max-width:420px; }
  select { width:100%; max-width:420px; padding:14px; border-radius:12px; background:#1b1f26;
           color:var(--fg); border:1px solid #2c323c; font-size:16px; }
  .modes { display:flex; gap:8px; width:100%; max-width:420px; }
  .modes button { font-size:15px; padding:14px 6px; min-height:52px; }
  .modes button.sel { background:var(--accent); color:#07130c; border-color:transparent; }
  .slider { width:100%; max-width:420px; display:flex; flex-direction:column; gap:6px;
            color:var(--dim); font-size:14px; }
  .slider b { color:var(--fg); }
  .slider input { width:100%; accent-color:var(--accent); height:34px; }
  .slider.off { opacity:.35; }
</style>
</head>
<body>
<h1>Hitster PL</h1>

<div id="s-login" class="screen">
  <p class="hint">Scan a card, hear the song, guess the year.</p>
  <button class="primary" id="login">Connect Spotify</button>
  <p class="hint">Spotify Premium required — playback runs through the Spotify app on this phone.</p>
</div>

<div id="s-scan" class="screen">
  <video id="video" playsinline muted autoplay></video>
  <p class="hint" id="scanhint">Point the camera at a card.</p>
  <div class="modes" id="modes">
    <button class="mode" data-len="0">Full song</button>
    <button class="mode" data-len="30">30 s</button>
    <button class="mode" data-len="5">5 s</button>
  </div>
  <label class="slider" id="sliderrow">
    <span>Clip length <b id="lenout">30 s</b></span>
    <input type="range" id="len" min="1" max="60" step="1" value="30">
  </label>
  <p class="err" id="scanerr"></p>
</div>

<div id="s-play" class="screen">
  <p class="status" id="status">Playing…</p>
  <div class="answer" id="answer" hidden>
    <div class="ar" id="a-artist"></div>
    <div class="yr" id="a-year"></div>
    <div class="ti" id="a-title"></div>
  </div>
  <button class="primary" id="reveal">Reveal</button>
  <div class="row">
    <button id="toggle">Pause</button>
    <button id="next">Next card</button>
  </div>
  <div class="row">
    <button id="replay">Replay from start</button>
  </div>
  <select id="devices" hidden></select>
  <p class="err" id="playerr"></p>
</div>

<script src="jsqr.js"></script>
<script>
// ---------------------------------------------------------------- config
const CLIENT_ID = '56278ffb67724af79eef6a27a75d21dc';
// Must match a Redirect URI registered in the Spotify dashboard, exactly.
const REDIRECT = location.origin + location.pathname;
const SCOPES = 'user-read-playback-state user-modify-playback-state';

const $ = id => document.getElementById(id);
const show = name => document.querySelectorAll('.screen')
  .forEach(s => s.classList.toggle('on', s.id === 's-' + name));

let deck = {};        // track_id -> {a: artist, t: title, y: year}
let deckError = null; // why the deck failed to load, if it did
let current = null;   // deck entry for the card being played
let currentId = null; // its Spotify track id
let playing = false;  // drives the Play/Pause button label
let started = false;  // has this card been played yet? decides start vs resume

// Answers come from deck.json, never from Spotify: Spotify's release_date is the
// remaster year and would date "Nie spoczniemy" to 2025 instead of 1977.
// no-store because a 404 cached before the deck was first deployed would otherwise
// stick around and make every card read "Unknown card".
async function loadDeck() {
  try {
    const r = await fetch('deck.json', {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    deck = await r.json();
    if (!Object.keys(deck).length) throw new Error('deck is empty');
  } catch (e) {
    deck = {};
    deckError = e.message;
  }
}

// ---------------------------------------------------------------- auth (PKCE)
// PKCE, not the client-credentials flow: this page is public, so it must never
// hold the client secret.
const store = {
  get t()  { return localStorage.getItem('tok'); },
  get r()  { return localStorage.getItem('ref'); },
  get exp(){ return +localStorage.getItem('exp') || 0; },
  save(j)  {
    localStorage.setItem('tok', j.access_token);
    if (j.refresh_token) localStorage.setItem('ref', j.refresh_token);
    localStorage.setItem('exp', Date.now() + (j.expires_in - 60) * 1000);
  },
  clear() { ['tok','ref','exp'].forEach(k => localStorage.removeItem(k)); }
};

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function login() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  sessionStorage.setItem('ver', verifier);
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const p = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT,
    scope: SCOPES, code_challenge_method: 'S256', code_challenge: b64url(digest)
  });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}

async function tokenReq(body) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({client_id: CLIENT_ID, ...body})
  });
  if (!r.ok) throw new Error('auth failed: ' + await r.text());
  return r.json();
}

async function exchangeCode(code) {
  const j = await tokenReq({grant_type:'authorization_code', code,
    redirect_uri: REDIRECT, code_verifier: sessionStorage.getItem('ver')});
  store.save(j);
  history.replaceState({}, '', REDIRECT);   // drop ?code= so a reload doesn't retry it
}

async function token() {
  if (store.t && Date.now() < store.exp) return store.t;
  if (!store.r) return null;
  try {
    store.save(await tokenReq({grant_type:'refresh_token', refresh_token: store.r}));
    return store.t;
  } catch { store.clear(); return null; }
}

async function api(path, opts = {}) {
  const t = await token();
  if (!t) { show('login'); throw new Error('signed out'); }
  const r = await fetch('https://api.spotify.com/v1' + path, {
    ...opts, headers: {...(opts.headers||{}), Authorization: 'Bearer ' + t}
  });
  if (r.status === 204 || r.status === 202) return null;
  const body = await r.text();
  if (!r.ok) throw Object.assign(new Error(body || r.status), {status: r.status});
  // Player commands (play/pause/seek) answer with an empty or non-JSON body and
  // nothing worth reading. Only parse when the response says it is JSON -- the
  // callers that need data (/me/player/devices, /tracks) always set the header.
  if (!body || !(r.headers.get('content-type') || '').includes('application/json')) {
    return null;
  }
  try {
    return JSON.parse(body);
  } catch {
    // Name the endpoint -- a bare "JSON Parse error: Unexpected identifier" gives
    // no clue which call produced it.
    throw new Error(`${path} returned non-JSON: ${body.slice(0, 60)}`);
  }
}

// ---------------------------------------------------------------- playback
// Spotify Connect can only target a device Spotify already knows about, so an
// empty device list means "open the Spotify app once", not a bug.
async function pickDevice(prefer) {
  const {devices = []} = await api('/me/player/devices') || {};
  const sel = $('devices');
  const want = prefer || sel.value;   // survive the rebuild below: keep the user's choice
  sel.hidden = devices.length < 2;
  sel.replaceChildren(...devices.map(d => {
    const o = document.createElement('option');
    o.value = d.id; o.textContent = d.name;   // device names are user-set; never inject as HTML
    return o;
  }));
  if (!devices.length) return null;
  const chosen = devices.find(d => d.id === want)
              || devices.find(d => d.is_active) || devices[0];
  sel.value = chosen.id;
  return chosen.id;
}

// clipLen: seconds to play, or 0 for the whole song under manual control.
let clipLen = +(localStorage.getItem('clipLen') ?? 30);
let clipTimer = null;

function cancelClip() { clearTimeout(clipTimer); clipTimer = null; }

// Durations are cached because /tracks is one request per card and this app has
// already been locked out of the API for 99 minutes once.
async function trackDuration(id) {
  const hit = localStorage.getItem('dur:' + id);
  if (hit) return +hit;
  const t = await api('/tracks/' + id);
  if (!t || !t.duration_ms) throw new Error('could not read track length');
  localStorage.setItem('dur:' + id, t.duration_ms);
  return t.duration_ms;
}

// Start somewhere in the body of the song: intros and fade-outs make poor clues.
async function clipStart(trackId, ms) {
  const dur = await trackDuration(trackId);
  const lo = Math.floor(dur * 0.15);
  const hi = Math.max(lo, dur - ms - 2000);
  return lo + Math.floor(Math.random() * Math.max(1, hi - lo));
}

async function play(trackId, prefer) {
  $('playerr').textContent = '';
  cancelClip();
  const device = await pickDevice(prefer);
  if (!device) {
    $('playerr').textContent = 'No Spotify device found. Open Spotify on this phone, press play once, then tap Next card.';
    return;
  }
  try {
    const ms = clipLen * 1000;
    const body = {uris: ['spotify:track:' + trackId]};
    if (ms) body.position_ms = await clipStart(trackId, ms);
    await api('/me/player/play?device_id=' + device, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    started = true;
    setPlaying(true);
    if (ms) clipTimer = setTimeout(async () => {
      try { await api('/me/player/pause', {method: 'PUT'}); } catch (e) {}
      setPlaying(false);
    }, ms);
  } catch (e) {
    setPlaying(false);
    $('playerr').textContent = e.status === 403
      ? 'Spotify refused playback — this needs a Premium account.'
      : 'Could not start playback: ' + String(e.message).slice(0, 140);
  }
}

// ---------------------------------------------------------------- scanning
const TRACK_RE = /track[/:]([A-Za-z0-9]{22})/;
let stream = null, scanning = false;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', {willReadFrequently: true});

async function startScan() {
  show('scan');
  cancelClip();   // a pending auto-stop must not fire onto the next card
  $('scanerr').textContent = '';
  $('answer').hidden = true;
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia(
      {video: {facingMode: {ideal: 'environment'}}});
  } catch {
    $('scanerr').textContent = 'No camera access. Allow it in Settings → Safari → Camera.';
    return;
  }
  const v = $('video');
  v.srcObject = stream;
  await v.play().catch(() => {});
  scanning = true;
  requestAnimationFrame(tick);
}

function tick() {
  if (!scanning) return;
  const v = $('video');
  if (v.readyState === v.HAVE_ENOUGH_DATA) {
    // Decode at ~400px: full sensor resolution costs frames and buys no accuracy.
    const scale = 400 / Math.max(v.videoWidth, 1);
    canvas.width = Math.round(v.videoWidth * scale);
    canvas.height = Math.round(v.videoHeight * scale);
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const hit = jsQR(img.data, img.width, img.height, {inversionAttempts: 'dontInvert'});
    const m = hit && hit.data.match(TRACK_RE);
    if (m) { onCard(m[1]); return; }
  }
  requestAnimationFrame(tick);
}

function onCard(trackId) {
  scanning = false;
  $('video').pause();
  currentId = trackId;
  current = deck[trackId] || null;
  started = false;              // nothing plays until the Play button is tapped
  $('playerr').textContent = '';
  $('answer').hidden = true;
  $('reveal').hidden = false;
  setPlaying(false);
  show('play');
  if (navigator.vibrate) navigator.vibrate(40);
}

// ---------------------------------------------------------------- wiring
function setPlaying(on) {
  playing = on;
  $('toggle').textContent = on ? 'Pause' : 'Play';
  $('status').textContent = on ? 'Playing…' : (started ? 'Paused' : 'Tap Play');
}

function setMode(len, {save = true} = {}) {
  clipLen = len;
  if (save) localStorage.setItem('clipLen', len);
  document.querySelectorAll('.mode').forEach(b =>
    b.classList.toggle('sel', +b.dataset.len === len));
  $('sliderrow').classList.toggle('off', len === 0);
  if (len) { $('len').value = len; }
  $('lenout').textContent = len ? len + ' s' : 'full song';
  $('replay').textContent = len ? 'Another clip' : 'Restart song';
}

document.querySelectorAll('.mode').forEach(b =>
  b.onclick = () => setMode(+b.dataset.len));
// Dragging the slider implies a clip, so it also drops you out of full-song mode.
$('len').oninput = e => setMode(+e.target.value);

$('login').onclick = login;
$('next').onclick = startScan;
// Switching output (phone -> speaker) restarts the same track on the new device.
$('devices').onchange = e => currentId && play(currentId, e.target.value);

// Resume, not restart: /play with no body picks up where the pause left off.
$('toggle').onclick = async () => {
  $('playerr').textContent = '';
  try {
    if (playing) {
      // Drop the auto-stop too, or it would fire later and cut short a resumed track.
      cancelClip();
      await api('/me/player/pause', {method: 'PUT'});
      setPlaying(false);
    } else if (!started) {
      await play(currentId);          // first tap: applies the clip mode
    } else {
      await api('/me/player/play', {method: 'PUT'});   // resume where it stopped
      setPlaying(true);
    }
  } catch (e) {
    if (e.status === 403 && playing) {
      setPlaying(false);   // Spotify refuses to pause what is already paused
      return;
    }
    $('playerr').textContent = e.status === 404
      ? 'Spotify lost the device. Press play in Spotify once, then tap Play again.'
      : String(e.message).slice(0, 140);
  }
};

$('replay').onclick = () => currentId && play(currentId);

$('reveal').onclick = () => {
  $('reveal').hidden = true;
  $('answer').hidden = false;
  if (current) {
    $('a-artist').textContent = current.a;
    $('a-year').textContent = current.y;
    $('a-title').textContent = current.t;
    return;
  }
  // Distinguish "deck never loaded" from "this card isn't in the deck" -- they look
  // identical on screen but need completely different fixes.
  $('a-artist').textContent = deckError ? 'Answer key not loaded' : 'Card not in deck';
  $('a-year').textContent = '—';
  $('a-title').textContent = deckError
    ? `deck.json: ${deckError}`
    : `track ${currentId || '?'}`;
};

(async function boot() {
  setMode(clipLen, {save: false});
  await loadDeck();
  const code = new URLSearchParams(location.search).get('code');
  if (code) { try { await exchangeCode(code); } catch (e) { console.error(e); } }
  if (await token()) startScan(); else show('login');
})();
</script>
</body>
</html>
